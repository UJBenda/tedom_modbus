type: sections
title: Tedom 584
path: view-584
icon: mdi:engine
max_columns: 4
show_icon_and_title: true
sections:
  - type: grid
    cards:
      - type: heading
        heading: Ovládání
        icon: mdi:tune-vertical
        badges:
          - type: entity
            entity: sensor.584_stav_motoru
            show_state: true
            show_icon: true
          - type: entity
            entity: sensor.584_stav_jistice
            show_state: true
            show_icon: true
      - type: tile
        entity: select.584_rezim_stroje
        name: Režim stroje
        icon: mdi:cog
        grid_options:
          columns: 12
        features:
          - type: select-options
      - type: tile
        entity: number.584_pozadovany_vykon
        name: Požadovaný výkon
        icon: mdi:flash
        features:
          - type: numeric-input
            style: buttons
      - type: tile
        entity: number.584_pozadovana_teplota
        name: Požadovaná teplota
        icon: mdi:thermometer
        features:
          - type: numeric-input
            style: buttons
      - type: tile
        entity: button.584_start_motoru
        name: Start
        icon: mdi:play-circle
        color: green
        grid_options:
          columns: 4
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.584_start_motoru
          confirmation:
            text: Opravdu nastartovat motor?
      - type: tile
        entity: button.584_stop_motoru
        name: Stop
        icon: mdi:stop-circle
        color: red
        grid_options:
          columns: 4
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.584_stop_motoru
          confirmation:
            text: Opravdu zastavit motor?
      - type: tile
        entity: button.584_reset_poruch
        name: Reset
        icon: mdi:restart-alert
        color: orange
        grid_options:
          columns: 4
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.584_reset_poruch
          confirmation:
            text: Opravdu resetovat poruchy?
  - type: grid
    cards:
      - type: heading
        heading: Plánovač podle spotu
        icon: mdi:calendar-clock
        badges:
          - type: entity
            entity: binary_sensor.584_plan_bezet_ted
            show_state: true
            show_icon: true
          - type: entity
            entity: sensor.584_plan_dalsi_start
            show_state: true
            show_icon: true
      - type: tile
        entity: select.584_planovac_rezim
        name: Režim plánovače
        icon: mdi:calendar-sync
        features:
          - type: select-options
        grid_options:
          columns: 12
      - type: tile
        entity: sensor.584_plan_dnes
        name: Plán dnes
        icon: mdi:calendar-today
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.584_plan_zitra
        name: Plán zítra
        icon: mdi:calendar-arrow-right
        grid_options:
          columns: 6
      - type: tile
        entity: select.584_planovac_strategie
        name: Strategie
        icon: mdi:chart-line
        features:
          - type: select-options
        grid_options:
          columns: 12
        visibility: &id001
          - condition: state
            entity: select.584_planovac_rezim
            state_not: Vypnuto
      - type: tile
        entity: number.584_planovac_pocet_startu
        name: Počet startů
        icon: mdi:counter
        features:
          - type: numeric-input
            style: buttons
        visibility: *id001
      - type: tile
        entity: number.584_planovac_bloky_na_beh_15_min
        name: Bloky na běh (15 min)
        icon: mdi:timer-sand
        features:
          - type: numeric-input
            style: buttons
        visibility: *id001
      - type: tile
        entity: number.584_planovac_cena_startu
        name: Cena startu
        icon: mdi:cash
        features:
          - type: numeric-input
            style: buttons
        visibility: *id001
      - type: tile
        entity: number.584_planovac_vykon_0_jmenovity
        name: Výkon pro výpočet
        icon: mdi:lightning-bolt
        features:
          - type: numeric-input
            style: buttons
        visibility: *id001
      - type: tile
        entity: time.584_planovac_smi_bezet_od
        name: Smí běžet od
        icon: mdi:clock-start
        visibility: *id001
      - type: tile
        entity: time.584_planovac_smi_bezet_do
        name: Smí běžet do
        icon: mdi:clock-end
        visibility: *id001
      - type: tile
        entity: switch.584_planovac_nejet_pri_zaporne_cene
        name: Nejet při záporné ceně
        icon: mdi:cash-remove
        features:
          - type: toggle
        grid_options:
          columns: 12
        visibility: *id001
      - type: tile
        entity: number.584_planovac_teplota_nadrze_plny_beh
        name: Nádrž – plný běh pod
        icon: mdi:thermometer-low
        features:
          - type: numeric-input
            style: buttons
        visibility: &id002
          - condition: state
            entity: select.584_planovac_rezim
            state: Podle teploty
      - type: tile
        entity: number.584_planovac_teplota_nadrze_bez_behu
        name: Nádrž – bez běhu nad
        icon: mdi:thermometer-high
        features:
          - type: numeric-input
            style: buttons
        visibility: *id002
      - type: tile
        entity: number.584_planovac_pojistka_max_teploty
        name: Pojistka max. teploty
        icon: mdi:thermometer-alert
        features:
          - type: numeric-input
            style: buttons
        grid_options:
          columns: 12
      - type: tile
        entity: button.584_prepocitat_plan_zitrka
        name: Přepočítat zítřek
        icon: mdi:calendar-refresh
        color: blue
        hide_state: true
        grid_options:
          columns: 6
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.584_prepocitat_plan_zitrka
      - type: tile
        entity: button.584_prepocitat_zbytek_dneska
        name: Přepočítat dnešek
        icon: mdi:calendar-today
        color: blue
        hide_state: true
        grid_options:
          columns: 6
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.584_prepocitat_zbytek_dneska
          confirmation:
            text: Přepočítat plán na zbytek dneška?
  - type: grid
    cards:
      - type: heading
        heading: Výkon
        icon: mdi:lightning-bolt
      - type: gauge
        entity: sensor.584_vykon_gen_cinny
        name: Činný výkon
        min: 0
        max: 100
      - type: gauge
        entity: sensor.584_otacky_motoru
        name: Otáčky
        min: 0
        max: 1800
      - type: tile
        entity: sensor.584_vykon_zateze
        name: Výkon zátěže
        icon: mdi:home-lightning-bolt
      - type: tile
        entity: sensor.584_vykon_ze_site
        name: Výkon ze sítě
        icon: mdi:transmission-tower
      - type: tile
        entity: sensor.584_ucinik
        name: Účiník
        icon: mdi:angle-acute
      - type: tile
        entity: sensor.584_jmenovity_vykon
        name: Jmenovitý výkon
        icon: mdi:information-outline
      - type: history-graph
        title: Výkon 24 h
        hours_to_show: 24
        grid_options:
          columns: 12
        entities:
          - entity: sensor.584_vykon_gen_cinny
            name: Generátor
          - entity: sensor.584_vykon_zateze
            name: Zátěž
          - entity: sensor.584_vykon_ze_site
